name: CI Automation Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # JOB 1: Unit Tests (JUnit 5 + Mockito) - Nhanh, không phụ thuộc DB/Server
  # =========================================================================
  unit-test:
    name: Unit Tests (JUnit 5 + Mockito)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Unit Tests
      run: mvn clean test -Dtest="*Test,!*UITest,!*SeleniumTest,!*IT" -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false

    - name: Upload Unit Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: target/surefire-reports/
        if-no-files-found: ignore

  # =========================================================================
  # JOB 2: Integration & UI Automation Tests (SQL Server + Tomcat 10 + Chrome)
  # =========================================================================
  ui-automation-test:
    name: Selenium UI Automation Test
    runs-on: ubuntu-latest
    needs: unit-test

    env:
      DB_PASSWORD: "YourStrong@Password123"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Setup Google Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: Start SQL Server 2022 & Create VstayDB
      run: |
        docker run -d --name sqlserver \
          -e "ACCEPT_EULA=Y" \
          -e "MSSQL_SA_PASSWORD=${{ env.DB_PASSWORD }}" \
          -p 1433:1433 \
          mcr.microsoft.com/mssql/server:2022-latest

        echo "Waiting for SQL Server 2022 to accept SQL queries..."
        for i in $(seq 1 30); do
          if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${{ env.DB_PASSWORD }}" -C -Q "SELECT 1" > /dev/null 2>&1; then
            echo "SQL Server is ready!"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "SQL Server failed to start in time!"
            docker logs sqlserver
            exit 1
          fi
          sleep 2
        done

        echo "Creating database VstayDB if not exists..."
        docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${{ env.DB_PASSWORD }}" -C -Q "IF DB_ID('VstayDB') IS NULL CREATE DATABASE VstayDB;"

    - name: Configure Hibernate for CI Environment
      run: |
        if [ -f src/main/resources/hibernate.cfg.xml ]; then
          sed -i 's|<property name="hibernate.connection.url">.*</property>|<property name="hibernate.connection.url">jdbc:sqlserver://localhost:1433;databaseName=VstayDB;encrypt=true;trustServerCertificate=true</property>|' src/main/resources/hibernate.cfg.xml
          sed -i 's|<property name="hibernate.connection.username">.*</property>|<property name="hibernate.connection.username">sa</property>|' src/main/resources/hibernate.cfg.xml
          sed -i "s|<property name=\"hibernate.connection.password\">.*</property>|<property name=\"hibernate.connection.password\">${{ env.DB_PASSWORD }}</property>|" src/main/resources/hibernate.cfg.xml
        fi

    - name: Package WAR Application
      run: mvn clean package -DskipTests

    - name: Start Tomcat 10 Container & Deploy WAR
      run: |
        WAR_FILE=$(ls target/*.war | head -n 1)
        if [ -z "$WAR_FILE" ]; then
          echo "ERROR: No .war file found in target/"
          ls -la target/
          exit 1
        fi

        echo "Deploying $WAR_FILE to Tomcat 10..."
        cp "$WAR_FILE" /tmp/vstay.war

        docker run -d --name tomcat-app \
          --network host \
          -v /tmp/vstay.war:/usr/local/tomcat/webapps/vstay.war \
          tomcat:10.1-jdk17

        echo "Waiting for Vstay application to deploy on http://localhost:8080/vstay/..."
        for i in $(seq 1 30); do
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/vstay/ || true)
          if [ "$STATUS" = "200" ] || [ "$STATUS" = "302" ]; then
            echo "Vstay is UP (HTTP $STATUS)!"
            break
          fi
          if [ "$i" -eq 30 ]; then
            echo "Tomcat / Vstay failed to start in time (Last HTTP status: $STATUS)!"
            docker logs tomcat-app
            exit 1
          fi
          sleep 2
        done

    - name: Seed Sample Data
      run: |
        echo "Seeding database (force=true to bypass idempotency check)..."
        SEED_STATUS=$(curl -s -o /tmp/seed_response.txt -w '%{http_code}' "http://localhost:8080/vstay/seed?force=true")
        echo "Seed HTTP status: $SEED_STATUS"
        cat /tmp/seed_response.txt || true
        if [ "$SEED_STATUS" != "200" ]; then
          echo "ERROR: Seed endpoint returned HTTP $SEED_STATUS"
          docker logs tomcat-app || true
          exit 1
        fi
        echo "Database seeded successfully!"

    - name: Run Selenium Automation Tests
      run: mvn test -Dtest="*IT,*SeleniumTest,*UITest" -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false

    - name: Print Container Logs on Failure
      if: failure()
      run: |
        echo "=== Tomcat Logs ==="
        docker logs tomcat-app || true
        echo "=== SQL Server Logs ==="
        docker logs --tail 50 sqlserver || true

    - name: Upload Failure Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-screenshots
        path: target/screenshots/
        if-no-files-found: ignore

    - name: Upload Automation Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-reports
        path: target/surefire-reports/
        if-no-files-found: ignore
