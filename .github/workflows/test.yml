name: CI Automation Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =============================================================
  # JOB 1: Chạy Unit Test nhanh (Fast Feedback: JUnit 5 + Mockito)
  # =============================================================
  unit-test:
    name: Unit Tests (JUnit 5 + Mockito)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run Unit Tests
      run: mvn test -Dtest="*Test"

    - name: Upload Surefire Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-reports
        path: target/surefire-reports/
        if-no-files-found: ignore

  # =============================================================
  # JOB 2: Chạy Automation UI Test (Selenium + SQL Server + Tomcat)
  # =============================================================
  ui-automation-test:
    name: Selenium UI Automation Test
    runs-on: ubuntu-latest
    needs: unit-test # Chỉ chạy khi Unit Test đã pass

    # Khởi tạo SQL Server làm service container
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "YourStrong@Password123"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    # Cài đặt trình duyệt Google Chrome mới nhất trên runner
    - name: Setup Google Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    # Build gói ứng dụng WAR
    - name: Package WAR
      run: mvn clean package -DskipTests

    # Tải và khởi động Apache Tomcat 10 chạy ngầm ứng dụng
    - name: Start Tomcat Server
      run: |
        wget https://archive.apache.org/dist/tomcat/tomcat-10/v10.1.20/bin/apache-tomcat-10.1.20.tar.gz
        tar -xzf apache-tomcat-10.1.20.tar.gz
        mv apache-tomcat-10.1.20 tomcat
        cp target/*.war tomcat/webapps/vstay.war
        chmod +x tomcat/bin/*.sh
        ./tomcat/bin/startup.sh
        
        # Đợi ứng dụng khởi động sẵn sàng
        echo "Waiting for Vstay web application to start on port 8080..."
        timeout 60 bash -c 'until curl -s http://localhost:8080/vstay/ > /dev/null; do sleep 2; done'
        echo "Application is UP and running!"

    # Khởi tạo dữ liệu mẫu (Seeding)
    - name: Seed Database
      run: |
        curl -s http://localhost:8080/vstay/seed || true

    # Thực thi các bài kiểm thử tự động Selenium
    - name: Run Selenium Automation Tests
      run: |
        mvn test -Dtest="*IT,*SeleniumTest,*UITest"

    # Đính kèm ảnh chụp màn hình nếu Selenium test bị fail (Artifact debug)
    - name: Upload Failure Screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: failure-screenshots
        path: target/screenshots/
        if-no-files-found: ignore

    - name: Upload Automation Test Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-test-reports
        path: target/surefire-reports/
        if-no-files-found: ignore